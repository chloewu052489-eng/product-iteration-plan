    const keyMat = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: Uint8Array.from(atob(SALT), c => c.charCodeAt(0)), iterations: 150000, hash: 'SHA-256' }, keyMat, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: Uint8Array.from(atob(IV), c => c.charCodeAt(0)) }, key, Uint8Array.from(atob(CT), c => c.charCodeAt(0)));
    document.open(); document.write(new TextDecoder().decode(plain)); document.close();
  } catch (e) { document.getElementById('err').textContent = '密码错误，请重试'; }
}
